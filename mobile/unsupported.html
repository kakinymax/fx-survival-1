<body style="background:#10141b;color:#eef2f6;font:18px/1.6 sans-serif;padding:24px">
<h1>アプリを起動できませんでした</h1>
<p>古いAndroidでは、Google Playストアから「AndroidシステムのWebView」と「Google Chrome」を更新し、アプリを開き直してください。WebViewは105以上が必要です。</p>
<p>更新できない場合や解決しない場合は、端末名とAndroidのバージョンをお知らせください。</p>
